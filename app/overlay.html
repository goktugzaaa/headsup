<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HeadsUp</title>
<style>
  /* The accent follows logo.style: teal for the HeadsUp look, Claude orange for the Claude
     look (body.style-claude, set by the host's "style" event). */
  :root {
    --accent: #2EC4B6;
    --accent-hover: #23A99D;
    --accent-ink: #062b27; /* text on the accent: white would fail contrast */
    --accent-rgb: 46, 196, 182;
    --cream: #f4efe8;
    --ink: rgba(255, 255, 255, 0.92);
    --ink-2: rgba(255, 255, 255, 0.62);
    --glass: rgba(26, 26, 28, 0.94);
    --glass-border: rgba(255, 255, 255, 0.14);
    --green: #3fb46b;
    --red: #e5484d;
  }
  body.style-claude {
    --accent: #d97757;
    --accent-hover: #e38a6a; /* lighter, not darker: the dark text keeps its contrast */
    --accent-ink: #1b120e;
    --accent-rgb: 217, 119, 87;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: transparent; overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; pointer-events: none;
  }

  /* ------------------------------------------------------------ banner */
  #stack {
    position: absolute; top: 14px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .banner {
    position: relative;
    width: min(440px, 92vw);
    display: grid; grid-template-columns: 40px 1fr auto; column-gap: 12px; align-items: start;
    padding: 12px 14px 13px 12px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(40,40,44,0.96), var(--glass));
    border: 1px solid var(--glass-border);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 18px 50px rgba(0,0,0,0.55),
      0 4px 14px rgba(0,0,0,0.35);
    color: var(--ink);
    transform: translateY(-140px) scale(0.96);
    opacity: 0;
    overflow: hidden;
    animation: slide-in 620ms cubic-bezier(0.18, 1.25, 0.32, 1) forwards;
  }
  .banner.leaving { animation: slide-out 380ms cubic-bezier(0.5, 0, 0.75, 0) forwards; }
  @keyframes slide-in { to { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes slide-out {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to   { transform: translateY(-120px) scale(0.96); opacity: 0; }
  }
  .app-icon {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(180deg, #34D3C0, #14968C);
    display: grid; place-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35), 0 0 0 0.5px rgba(255,255,255,0.18) inset;
  }
  /* The mark is drawn in the app icon's own frame, so it fills the tile the same way. */
  .app-icon svg { width: 40px; height: 40px; }
  /* An amber dot would vanish on the amber permission tile. */
  .banner.permission .app-icon .mk-dot { fill: #fff; }
  /* Banners from Claude with the Claude look: Claude's white starburst on Claude orange. */
  .app-icon.claude { background: linear-gradient(160deg, #e8906f, #d97757 55%, #c4623f); }
  .app-icon.claude svg { width: 26px; height: 26px; }
  .texts { min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 1px; }
  .title { font-weight: 650; font-size: 15px; letter-spacing: -0.01em; line-height: 18px; }
  .subtitle { font-size: 13.5px; color: var(--ink); opacity: 0.9; line-height: 17px; }
  .body {
    font-size: 13.5px; color: var(--ink-2); line-height: 17px; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .time { font-size: 12.5px; color: var(--ink-2); padding-top: 2px; white-space: nowrap; }
  /* Close (×): top-right of every banner and card, next to the time, and in the logo's caption.
     It never takes the keyboard (tabindex -1, and a press does not focus it), except on a card
     whose Other… field has it: then Tab reaches it. On a plain banner only the × takes clicks. */
  .side { display: flex; align-items: center; gap: 4px; margin: -4px -6px 0 0; }
  .side .time { padding-top: 0; }
  .x {
    appearance: none; flex: none; width: 24px; height: 24px; padding: 0; margin: 0;
    border: 0; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,0.07); color: var(--ink-2);
    cursor: pointer; pointer-events: auto;
    transition: background 120ms, color 120ms, opacity 150ms;
  }
  .x svg { width: 10px; height: 10px; }
  .x:hover { background: rgba(255,255,255,0.16); color: var(--ink); }
  .x:active { background: rgba(255,255,255,0.22); }
  .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .banner.arming .x { opacity: 0.55; }
  .banner.permission .app-icon { background: linear-gradient(160deg, #ffd27a, #f0a93b 55%, #d98b1c); }
  .banner.info .app-icon { background: linear-gradient(160deg, #8bb7ff, #5a8def 55%, #3f6fd0); }
  .banner.question .app-icon { background: linear-gradient(160deg, #c9a2ff, #9b6cf0 55%, #7a4fd1); }
  /* A usage limit used up. */
  .banner.limit .app-icon { background: linear-gradient(160deg, #ff9b8a, #ec5f4c 55%, #cf4433); }
  .banner.limit .app-icon .mk-dot { fill: #fff; }
  .banner.question .body, .banner.permission .body { -webkit-line-clamp: 3; color: var(--ink); }
  .banner.permission .body { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }

  /* ------------------------------------------------------- interactive */
  .banner.interactive {
    pointer-events: auto; cursor: default;
    width: min(480px, 92vw);
    padding: 14px 16px 16px 14px;
    border-radius: 24px;
  }
  .banner.interactive .texts { gap: 3px; }
  /* The whole question stays readable: it scrolls instead of being clamped. */
  .banner.interactive .body {
    font-size: 15px; line-height: 20px; color: var(--ink); font-weight: 500;
    margin-top: 4px; display: block; -webkit-line-clamp: none; white-space: pre-line; max-height: 120px; overflow-y: auto;
  }
  .banner.interactive .body, .cmd, .list { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent; }
  /* Cards with buttons beyond the newest few wait, counted in the "+N" pill. */
  .banner.queued { display: none; }
  .more {
    padding: 4px 12px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-border);
    color: var(--ink-2); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  /* Until the pointer moves over a card that has just appeared or moved, clicks are ignored. */
  .actions, .list { transition: opacity 150ms; }
  .banner.arming .actions, .banner.arming .list { opacity: 0.55; }
  .qhead { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-top: 6px; }
  /* Earlier questions answered on the phone, above the one the card moved on to. */
  .pnote {
    font-size: 12px; line-height: 16px; color: var(--green); font-weight: 600; margin-top: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pnote[hidden] { display: none; }
  .panel { grid-column: 1 / -1; margin-top: 12px; }
  .list {
    display: flex; flex-direction: column;
    background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px; overflow-x: hidden; overflow-y: auto; max-height: 300px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 11px 14px; cursor: pointer;
    border-top: 1px solid rgba(255,255,255,0.07);
    transition: background 120ms;
  }
  .row:first-child { border-top: 0; }
  .row:hover { background: rgba(255,255,255,0.10); }
  .row:active { background: rgba(var(--accent-rgb), 0.28); }
  .row .lbl { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 18px; }
  .row .desc { font-size: 12.5px; color: var(--ink-2); line-height: 16px; margin-top: 2px; }
  .row .chev { color: var(--ink-2); font-size: 15px; opacity: 0.55; flex: none; }
  .row.sel { background: rgba(var(--accent-rgb), 0.20); }
  .row.sel .chev { color: var(--accent); opacity: 1; }
  .cmd {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; line-height: 18px;
    color: var(--cream); background: rgba(0,0,0,0.38); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all;
    /* The full text the host sends (line breaks kept) scrolls; nothing is clipped silently. */
    max-height: 216px; overflow: auto;
    direction: ltr; unicode-bidi: isolate;
  }
  /* Cut markers and made-visible hidden characters must stand out from the command. */
  .cmd .mark { color: #ffd27a; background: rgba(240,169,59,0.18); border-radius: 4px; }
  .row.other .lbl { color: var(--ink-2); font-weight: 500; }
  .free { display: flex; gap: 8px; margin-top: 10px; }
  .free input {
    flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink);
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px;
    padding: 0 12px; height: 42px; outline: none;
  }
  .free input:focus { border-color: rgba(var(--accent-rgb), 0.8); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.2); }
  .free .btn { width: 110px; flex: none; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .actions.single { grid-template-columns: 1fr; }
  .btn {
    appearance: none; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08);
    color: var(--ink); font: inherit; font-size: 14px; font-weight: 650; height: 42px; border-radius: 13px;
    cursor: pointer; transition: background 120ms, transform 120ms, border-color 120ms;
  }
  .btn:hover { background: rgba(255,255,255,0.14); }
  .btn:active { transform: scale(0.985); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger:hover { background: rgba(229,72,77,0.22); border-color: rgba(229,72,77,0.6); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; min-height: 16px; font-size: 11.5px; color: var(--ink-2); }
  .foot .hint { font-weight: 600; }
  .foot .count { font-variant-numeric: tabular-nums; opacity: 0.8; }
  .progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--accent); opacity: 0.7; transform-origin: left; }
  .banner.answered .panel:not(.foot), .banner.answered .progress, .banner.expired .panel:not(.foot), .banner.expired .progress { display: none; }
  .banner.answered .foot .hint { color: var(--green); }
  .banner.answered .foot .count, .banner.expired .foot .count { display: none; }

  /* -------------------------------------------------------------- logo */
  #logo-slot {
    position: absolute; top: 18px; right: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .logo-card {
    position: relative;
    width: 150px; height: 150px;
    display: grid; place-items: center;
    opacity: 0;
    transform: scale(0.2) rotate(-120deg);
    animation: logo-in 900ms cubic-bezier(0.17, 1.35, 0.35, 1) forwards;
  }
  .logo-card.leaving { animation: logo-out 500ms cubic-bezier(0.5, 0, 0.75, 0) forwards; }
  @keyframes logo-in { to { opacity: 1; transform: scale(1) rotate(0deg); } }
  @keyframes logo-out {
    from { opacity: 1; transform: scale(1) rotate(0deg); }
    to   { opacity: 0; transform: scale(0.6) rotate(40deg); }
  }
  .glow {
    position: absolute; inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(46,196,182,0.55) 0%, rgba(46,196,182,0.18) 40%, rgba(46,196,182,0) 70%);
    animation: glow-pulse 1.8s ease-in-out infinite;
    filter: blur(2px);
  }
  @keyframes glow-pulse {
    0%, 100% { transform: scale(0.9); opacity: 0.7; }
    50%      { transform: scale(1.15); opacity: 1; }
  }
  .ring {
    position: absolute; inset: 12px; border-radius: 50%;
    border: 2px solid rgba(244,239,232,0.0);
    animation: ring-burst 1.6s ease-out infinite;
  }
  .ring.r2 { animation-delay: 0.55s; }
  .ring.r3 { animation-delay: 1.1s; }
  @keyframes ring-burst {
    0%   { transform: scale(0.55); border-color: rgba(244,239,232,0.55); }
    100% { transform: scale(1.35); border-color: rgba(244,239,232,0); }
  }
  .logo-svg {
    width: 118px; height: 118px; position: relative;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
  }
  /* The chevrons rise in a loop, the lower one a beat later; the dot pulses. */
  .logo-svg .mk-up, .logo-svg .mk-low { animation: rise 1.5s ease-in-out infinite; }
  .logo-svg .mk-low { animation-delay: 0.16s; }
  @keyframes rise {
    0%, 100% { transform: translateY(0); }
    45%, 55% { transform: translateY(-7px); }
  }
  .logo-svg .mk-dot {
    transform-box: fill-box; transform-origin: center;
    animation: dot-pulse 1.5s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }
  /* With the Claude look, Claude's starburst: orange glow, a slow turn on arrival, and the
     rays breathing one after another (delays here, not inline: CSP). */
  .logo-card.claude .glow {
    background: radial-gradient(circle, rgba(217,119,87,0.55) 0%, rgba(217,119,87,0.18) 40%, rgba(217,119,87,0) 70%);
  }
  .logo-card.claude .logo-svg { animation: spin-slow 9s cubic-bezier(0.3, 0.1, 0.2, 1) forwards; }
  @keyframes spin-slow { to { transform: rotate(28deg); } }
  .logo-svg .ray { transform-origin: 50px 50px; animation: breathe 1.5s ease-in-out infinite; }
  .logo-svg .ray:nth-child(2)  { animation-delay: 0.09s; }
  .logo-svg .ray:nth-child(3)  { animation-delay: 0.18s; }
  .logo-svg .ray:nth-child(4)  { animation-delay: 0.27s; }
  .logo-svg .ray:nth-child(5)  { animation-delay: 0.36s; }
  .logo-svg .ray:nth-child(6)  { animation-delay: 0.45s; }
  .logo-svg .ray:nth-child(7)  { animation-delay: 0.54s; }
  .logo-svg .ray:nth-child(8)  { animation-delay: 0.63s; }
  .logo-svg .ray:nth-child(9)  { animation-delay: 0.72s; }
  .logo-svg .ray:nth-child(10) { animation-delay: 0.81s; }
  .logo-svg .ray:nth-child(11) { animation-delay: 0.90s; }
  .logo-svg .ray:nth-child(12) { animation-delay: 0.99s; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.09); }
  }
  /* After LOGO_SETTLE_MS the loops stop, each at the end of a round (its resting pose), so a
     logo that waits for a click for hours does not keep repainting. */
  #logo-slot .still { animation: none; }
  #logo-slot .glow.still { transform: scale(0.9); opacity: 0.7; }
  .caption {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 4px 4px 14px; min-height: 32px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-border);
    color: var(--cream); font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(-8px);
    animation: caption-in 500ms 350ms cubic-bezier(0.2, 1, 0.3, 1) forwards;
    white-space: nowrap;
  }
  .caption.leaving { animation: caption-out 300ms ease-in forwards; }
  @keyframes caption-in { to { opacity: 1; transform: translateY(0); } }
  @keyframes caption-out { to { opacity: 0; transform: translateY(-8px); } }
  .caption b { color: var(--accent); }
  /* Under the caption while the logo waits for a click (logo.dismiss "anyClick" / "logoClick"). */
  .logo-hint {
    margin-top: -4px;
    padding: 4px 11px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-border);
    color: var(--ink-2); font-size: 11.5px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    opacity: 0; transform: translateY(-8px);
    animation: caption-in 500ms 700ms cubic-bezier(0.2, 1, 0.3, 1) forwards;
    white-space: nowrap;
  }
  .logo-hint.leaving { animation: caption-out 300ms ease-in forwards; }
  /* Once its guard time has passed, the logo takes clicks on itself (a hot rect). */
  #logo-slot.armed .logo-card, #logo-slot.armed .caption, #logo-slot.armed .logo-hint { pointer-events: auto; cursor: pointer; }
  #logo-slot.armed:hover .logo-hint { color: var(--ink); }
  /* Its × (in the caption, away from the corner where windows have their own close button)
     works after the guard time too, also on a logo that leaves by itself. */
  #logo-slot:not(.closable) .x { pointer-events: none; opacity: 0.55; }
</style>
</head>
<body class="style-headsup">
  <div id="stack"></div>
  <div id="logo-slot"></div>
  <canvas id="icon-canvas" width="32" height="32" hidden></canvas>

<script>
  // Bridge to the host. Electron provides window.overlay through its preload script;
  // the Tauri build exposes window.__TAURI__ (invoke + events) and gets the same API here.
  if (!window.overlay && window.__TAURI__) {
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    window.overlay = {
      on(channel, handler) { return listen(channel, (e) => handler(e.payload)); },
      ready() { invoke('ready'); },
      itemDone() { invoke('item_done'); },
      log(message) { invoke('rlog', { message: String(message) }); },
      sendTrayIcon() {},
      hotRects(rects) { invoke('hot_rects', { rects }); },
      answer(id, data) { invoke('answer', { id: String(id), data }); },
      dismissCard(id) { invoke('dismiss_card', { id: String(id) }); },
      extendWait(id, ms) { invoke('extend_wait', { id: String(id), ms }); },
      focusInput(active) { invoke('focus_input', { active: !!active }); },
      logoState(visible, anyClick) { invoke('logo_state', { visible: !!visible, anyClick: !!anyClick }); },
    };
  }

  // Claude's starburst: shown only for news from Claude with the Claude look (logo.style
  // "claude"), never as HeadsUp's own logo. 12 rays with slightly irregular angle, length and
  // weight; colours are attributes (CSP), the breathing on the big logo comes from CSS.
  const RAYS = [
    [  0, 1.00, 10.5 ], [ 32, 0.78, 9.5 ], [ 58, 0.92, 10 ], [ 90, 0.70, 9 ],
    [ 118, 0.96, 10.5 ], [ 150, 0.74, 9 ], [ 180, 1.00, 10.5 ], [ 212, 0.80, 9.5 ],
    [ 238, 0.90, 10 ], [ 270, 0.72, 9 ], [ 298, 0.95, 10.5 ], [ 330, 0.76, 9 ],
  ];

  function starburstSvg({ size = 100, color = '#d97757' } = {}) {
    const cx = 50, cy = 50, inner = 9, outer = 46;
    const rays = RAYS.map(([deg, len, w]) => {
      const a = (deg * Math.PI) / 180;
      const r2 = inner + (outer - inner) * len;
      const x1 = cx + Math.cos(a) * inner, y1 = cy + Math.sin(a) * inner;
      const x2 = cx + Math.cos(a) * r2,    y2 = cy + Math.sin(a) * r2;
      return `<line class="ray" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
    }).join('');
    return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">${rays}</svg>`;
  }

  // HeadsUp mark: two rising chevrons and an amber dot, in the app icon's 100x100 frame (its
  // rounded square spans 4..96). Colours are attributes, not inline styles (CSP).
  function markShapes(color, dot) {
    const line = `fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round"`;
    return `<polyline class="mk-up" points="23,57 46,35 69,57" ${line} stroke-width="11.7"/>`
      + `<polyline class="mk-low" points="29,77.5 46,62.5 63,77.5" ${line} stroke-width="9.4" opacity=".6"/>`
      + `<circle class="mk-dot" cx="75" cy="26" r="10" fill="${dot}"/>`;
  }

  function markSvg({ size = 100, color = '#fff', dot = '#FFC457' } = {}) {
    return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">${markShapes(color, dot)}</svg>`;
  }

  // The whole app icon: teal rounded square with a gap around the dot, white chevrons, amber
  // dot. Ids are unique per copy, since several can be in the page at once.
  let badgeSeq = 0;
  function badgeSvg({ size = 100 } = {}) {
    const id = `hu-badge-${++badgeSeq}`;
    return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">`
      + `<defs><linearGradient id="${id}-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D3C0"/><stop offset="1" stop-color="#14968C"/></linearGradient>`
      + `<mask id="${id}-m"><rect width="100" height="100" fill="#fff"/><circle cx="75" cy="26" r="14" fill="#000"/></mask></defs>`
      + `<rect x="4" y="4" width="92" height="92" rx="22" fill="url(#${id}-g)" mask="url(#${id}-m)"/>`
      + `${markShapes('#fff', '#FFC457')}</svg>`;
  }

  // ------------------------------------------------------------ audio
  let audioCtx = null;
  function ctx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, start, dur, gain = 0.18, type = 'sine') {
    const ac = ctx();
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime + start);
    g.gain.setValueAtTime(0.0001, ac.currentTime + start);
    g.gain.exponentialRampToValueAtTime(gain, ac.currentTime + start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + dur);
    osc.connect(g).connect(ac.destination);
    osc.start(ac.currentTime + start);
    osc.stop(ac.currentTime + start + dur + 0.05);
  }
  function chimeNotify() {
    tone(1046.5, 0.00, 0.22, 0.16);
    tone(1318.5, 0.11, 0.26, 0.14);
    tone(1568.0, 0.22, 0.45, 0.12);
  }
  function chimeAsk() {
    tone(880.0, 0.00, 0.25, 0.14);
    tone(1174.7, 0.14, 0.40, 0.14);
  }
  function chimeLogo() {
    tone(523.25, 0.00, 0.30, 0.12, 'triangle');
    tone(659.25, 0.12, 0.30, 0.12, 'triangle');
    tone(783.99, 0.24, 0.30, 0.12, 'triangle');
    tone(1046.5, 0.36, 0.70, 0.14, 'triangle');
    tone(2093.0, 0.42, 0.60, 0.05, 'sine');
  }

  // ------------------------------------------------------------ banner
  const stack = document.getElementById('stack');
  const MAX_BANNERS = 3;      // plain banners on screen at once
  const MAX_INTERACTIVE = 3;  // cards with buttons on screen at once; the rest wait behind "+N"
  const ARM_MS = 700;         // a new card ignores clicks this long, and until the pointer moves over it
  const REARM_MS = 350;       // the same after a card moved or changed under the pointer

  // The host decides the logo per banner: Claude's for news from Claude with the Claude look,
  // the HeadsUp mark otherwise.
  function appIcon(p) {
    return p.icon === 'claude'
      ? `<div class="app-icon claude">${starburstSvg({ size: 26, color: '#fff' })}</div>`
      : `<div class="app-icon">${markSvg({ size: 40 })}</div>`;
  }

  // The × of banners, cards and the logo. A press never moves the keyboard focus (an open
  // Other… field keeps it); `close` runs on the click.
  function closeButton(p, close) {
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'x';
    x.tabIndex = -1;
    const label = p.closeLabel || 'Close';
    x.title = label;
    x.setAttribute('aria-label', label);
    x.innerHTML = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>';
    x.addEventListener('mousedown', (e) => e.preventDefault());
    x.addEventListener('click', (e) => { e.stopPropagation(); close(); });
    return x;
  }

  function bannerShell(p, extraClass) {
    const el = document.createElement('div');
    el.className = `banner ${p.kind || 'done'} ${extraClass || ''}`;
    el.innerHTML = `
      ${appIcon(p)}
      <div class="texts">
        <div class="title">${escapeHtml(p.title || 'Claude')}</div>
        ${p.subtitle ? `<div class="subtitle">${escapeHtml(p.subtitle)}</div>` : ''}
        <div class="content"></div>
      </div>
      <div class="side"><div class="time">${escapeHtml(p.nowLabel || 'now')}</div></div>`;
    el.querySelector('.side').appendChild(closeButton(p,
      () => (el.classList.contains('interactive') ? closeCard(el, true) : dismiss(el))));
    // Clicks (on the × of a banner, anywhere on a card) count only once the pointer has moved
    // over it after it settled.
    disarm(el, ARM_MS);
    armOnMove(el);
    if (extraClass === 'interactive') {
      // Newest card on top, so it is always on screen; older ones move down or wait.
      stack.prepend(el);
      return el;
    }
    stack.appendChild(el);
    const plain = [...stack.children].filter((b) =>
      b.classList.contains('banner') && !b.classList.contains('interactive') && !b.classList.contains('leaving'));
    while (plain.length > MAX_BANNERS) dismiss(plain.shift());
    return el;
  }

  function showBanner(p) {
    const el = bannerShell(p);
    const c = el.querySelector('.content');
    if (p.body) c.innerHTML = `<div class="body">${escapeHtml(p.body)}</div>`;
    else c.remove();
    if (p.sound) { try { chimeNotify(); } catch {} }
    el._timer = setTimeout(() => dismiss(el), p.durationMs || 6000);
    // Its × takes clicks: the overlay must know where it is.
    reportHotRects();
  }

  function dismiss(el) {
    if (!el || el.classList.contains('leaving')) return;
    const inter = el.classList.contains('interactive');
    if (inter) window.overlay.log(`dismiss ${el.dataset.id}`);
    clearTimeout(el._timer);
    el.classList.add('leaving');
    const gone = () => {
      el.remove();
      if (inter) layoutStack();
      window.overlay.itemDone();
    };
    // A waiting card is not rendered: there is no slide-out to wait for.
    if (el.classList.contains('queued')) { gone(); return; }
    reportHotRects();
    el.addEventListener('animationend', gone, { once: true });
  }

  // ------------------------------------------------------- interactive
  const interactive = new Map(); // id -> element
  // Cards closed on the PC (× or the hide hotkey): they never come back, not even when their
  // own event arrives after the host closed them.
  const closed = new Set();

  // Close a card: it leaves the PC for good. `tellHost`: the × was clicked (the hide hotkey
  // comes from the host, which has closed the card already). The host keeps it open for the
  // phone, or gives it back to Claude Code's own dialog; a card already answered just goes.
  function closeCard(el, tellHost) {
    const id = String(el.dataset.id);
    const open = interactive.get(id) === el && !el.classList.contains('answered');
    if (interactive.get(id) === el) interactive.delete(id);
    closed.add(id);
    // Phone progress no longer moves it, and an open Other… field gives the keyboard back.
    el._progress = null;
    releaseInput(el);
    if (open && tellHost) window.overlay.dismissCard(id);
    dismiss(el);
  }

  // The hide hotkey: every banner, card and the logo leave at once. `ids`: the cards the host
  // closed, including any whose own event is still on its way. A card shown here that the host
  // did not list (it arrived in between) is closed as with its ×, so the host closes it too.
  function hideAll({ ids }) {
    const listed = new Set((ids || []).map(String));
    for (const id of listed) closed.add(id);
    window.overlay.log(`hide-all cards=${listed.size}`);
    for (const el of [...stack.querySelectorAll('.banner:not(.leaving)')]) {
      if (el.classList.contains('interactive')) closeCard(el, !listed.has(String(el.dataset.id)));
      else dismiss(el);
    }
    hideLogo();
  }

  // Keep the main process informed about where the clickable banners (and a limit-reset logo
  // that takes clicks) are.
  let rectTimer = null;
  function reportHotRects() {
    const rects = [];
    // Only the part inside the window can be clicked.
    const add = (r) => {
      const t = Math.max(0, r.top), b = Math.min(window.innerHeight, r.bottom);
      if (b > t && r.right > r.left) rects.push({ left: r.left, top: t, right: r.right, bottom: b });
    };
    // Banners slide in and move, so their places are re-sent while any is up (one still above
    // the window as it slides in has no rect yet); the logo stays put.
    let moving = 0;
    for (const el of stack.querySelectorAll('.banner')) {
      if (el.classList.contains('leaving') || el.classList.contains('queued')) { delete el._top; continue; }
      moving += 1;
      // A banner that moved (one above it came, went or changed size) must not take a click
      // aimed at what was there before.
      const top = el.offsetTop;
      if (el._top !== undefined && Math.abs(top - el._top) > 8) disarm(el, REARM_MS);
      el._top = top;
      // A card takes clicks all over; a plain banner only on its ×, and stays click-through.
      const target = el.classList.contains('interactive') ? el : el.querySelector('.x');
      if (target) add(target.getBoundingClientRect());
    }
    if (logo && !logo.leaving && logoSlot.classList.contains('armed')) {
      // Layout boxes (offset*), not the animated ones: the card turns and the captions slide.
      const s = logoSlot.getBoundingClientRect();
      for (const el of [logo.card, logo.cap, logo.hint]) {
        if (!el || !el.offsetHeight) continue;
        const left = s.left + el.offsetLeft, top = s.top + el.offsetTop;
        rects.push({ left, top, right: left + el.offsetWidth, bottom: top + el.offsetHeight });
      }
    } else if (logo && !logo.leaving && logoSlot.classList.contains('closable')) {
      // A logo that leaves by itself takes clicks only on its × (its caption has settled).
      add(logo.x.getBoundingClientRect());
    }
    window.overlay.hotRects(rects);
    if (moving && !rectTimer) rectTimer = setInterval(reportHotRects, 250);
    if (!moving && rectTimer) { clearInterval(rectTimer); rectTimer = null; }
  }
  // The window follows the cursor to another monitor and takes its width: the logo (anchored
  // right) moves with it, so its rect is sent again.
  window.addEventListener('resize', () => reportHotRects());

  // Show the newest cards that fit in the window (at most MAX_INTERACTIVE; the newest always,
  // and a card whose Other… field is open is never hidden). The rest wait behind "+N" and
  // come in as cards above them are answered.
  function layoutStack() {
    const cards = [...stack.querySelectorAll('.banner.interactive:not(.leaving)')];
    let more = stack.querySelector('.more');
    if (more) more.remove(); // measured without it
    const room = window.innerHeight - stack.offsetTop - 36; // leave space for the pill
    let shown = 0, waiting = 0, last = null;
    for (const el of cards) {
      const wasQueued = el.classList.contains('queued');
      el.classList.remove('queued');
      const fits = shown === 0
        || (!waiting && shown < MAX_INTERACTIVE && el.offsetTop + el.offsetHeight <= room);
      if (fits || el.querySelector('.free')) {
        shown += 1;
        last = el;
        if (wasQueued) {
          disarm(el, ARM_MS);
          if (el._runBar) el._runBar();
        }
      } else {
        el.classList.add('queued');
        waiting += 1;
      }
    }
    if (waiting && last) {
      if (!more) { more = document.createElement('div'); more.className = 'more'; }
      more.textContent = `+${waiting}`;
      last.after(more);
    }
    reportHotRects();
  }

  // Clicks count only once the card has settled and the pointer has moved over it, so a
  // click aimed at the window underneath never lands on Allow.
  function disarm(el, ms) {
    el._armAt = performance.now() + ms;
    el._moved = false;
    el.classList.add('arming');
  }
  function armOnMove(el) {
    el.addEventListener('pointermove', (e) => {
      // The position must change: a card appearing under a resting pointer, or the window
      // turning clickable, can produce a move event without any movement.
      const moved = el._px !== undefined && (e.screenX !== el._px || e.screenY !== el._py);
      el._px = e.screenX;
      el._py = e.screenY;
      if (moved && performance.now() >= el._armAt) {
        el._moved = true;
        el.classList.remove('arming');
      }
    });
    // A touch tap has no pointermove before its click: once the delay has passed, the tap
    // itself arms the card (pointerdown comes before click).
    el.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse' && performance.now() >= el._armAt) {
        el._moved = true;
        el.classList.remove('arming');
      }
    });
    el.addEventListener('click', (e) => {
      if (!el._moved) { e.stopPropagation(); e.preventDefault(); }
    }, true);
  }

  // Hand keyboard focus back when this card's Other… field had it. Another card's open field
  // keeps it: the overlay stays focusable while any field is open.
  function releaseInput(el) {
    const input = el.querySelector('.free input');
    if (!input) return;
    // Without the keyboard, Tab no longer reaches the card's ×.
    const x = el.querySelector('.x');
    if (x) x.tabIndex = -1;
    input.blur();
    const others = [...stack.querySelectorAll('.free input')]
      .some((i) => i !== input && !i.closest('.answered, .expired, .leaving'));
    if (!others) window.overlay.focusInput(false);
  }

  // Cut markers and made-visible hidden characters from the host, highlighted.
  function markup(s) {
    return escapeHtml(s).replace(/⟦U\+[0-9A-F]{4,6}⟧|⏎|… \(\+\d+ more (?:chars|edits)\)/g,
      (m) => `<span class="mark">${m}</span>`);
  }

  function showInteractive(p) {
    // Closed by the hide hotkey before its event got here: it never shows.
    if (closed.has(String(p.id))) { window.overlay.itemDone(); return; }
    const el = bannerShell(p, 'interactive');
    el.dataset.id = p.id;
    el._labels = p.labels;
    interactive.set(String(p.id), el);
    setTimeout(reportHotRects, 50);
    setTimeout(reportHotRects, 700);
    const c = el.querySelector('.content');
    const panel = document.createElement('div');
    panel.className = 'panel';
    const foot = document.createElement('div');
    foot.className = 'panel foot';
    foot.innerHTML = `<span class="hint"></span><span class="count"></span>`;
    el.appendChild(panel);
    el.appendChild(foot);
    const bar = document.createElement('div');
    bar.className = 'progress';
    el.appendChild(bar);
    const count = foot.querySelector('.count');
    let deadline = Date.now() + p.waitMs;
    let span = p.waitMs;
    // The bar shows the time left; it is rerun when a waiting card comes into view.
    el._runBar = () => {
      const left = Math.max(0, deadline - Date.now());
      bar.style.transition = 'none';
      bar.style.transform = `scaleX(${span > 0 ? left / span : 0})`;
      void bar.offsetWidth;
      bar.style.transition = `transform ${left}ms linear`;
      bar.style.transform = 'scaleX(0)';
    };
    requestAnimationFrame(el._runBar);
    const restartCountdown = (ms) => {
      deadline = Date.now() + ms;
      span = ms;
      el._runBar();
      clearTimeout(el._tick);
      tick();
    };
    const tick = () => {
      if (!count.isConnected || el.classList.contains('answered')) return;
      const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      count.textContent = left >= 90 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : `${left}s`;
      if (left > 0) el._tick = setTimeout(tick, 250);
    };
    tick();
    if (p.sound) { try { chimeAsk(); } catch {} }

    if (p.kind === 'permission') {
      c.remove();
      panel.innerHTML = `<div class="cmd">${markup(p.body || '')}</div>
        <div class="actions">
          <button class="btn danger">${escapeHtml(p.labels.deny)}</button>
          <button class="btn primary">${escapeHtml(p.labels.allow)}</button>
        </div>`;
      panel.querySelector('.danger').addEventListener('click', () => answer(p, el, { behavior: 'deny' }));
      panel.querySelector('.primary').addEventListener('click', () => answer(p, el, { behavior: 'allow' }));
      layoutStack();
      return;
    }

    // Questions, one at a time, as a tappable list.
    const answers = {};
    // Answers recorded on the phone (question key -> answer): they stand, and the card moves
    // past them ("card-progress").
    const phone = {};
    const keyOf = (q) => q.key || q.question;
    const byPhone = (q) => Object.prototype.hasOwnProperty.call(phone, keyOf(q));
    let idx = 0;
    // Above the question: what the phone answered for the questions before it.
    const renderNote = () => {
      const note = c.querySelector('.pnote');
      if (!note) return;
      const total = p.questions.length;
      const done = p.questions.map((q, i) => (i < idx && byPhone(q)
        ? `${total > 1 ? `${i + 1}/${total} ` : ''}${phone[keyOf(q)]}` : null)).filter((s) => s !== null);
      note.hidden = !done.length;
      note.textContent = done.length ? `✓ ${p.labels.answeredOnPhone || 'Answered on the phone'} · ${done.join(' · ')}` : '';
    };
    const renderQ = () => {
      const q = p.questions[idx];
      const total = p.questions.length;
      const selected = new Set();
      c.innerHTML = `
        <div class="pnote" hidden></div>
        ${q.header || total > 1 ? `<div class="qhead">${escapeHtml(q.header || '')}${total > 1 ? ` · ${idx + 1}/${total}` : ''}</div>` : ''}
        <div class="body">${escapeHtml(q.question)}</div>`;
      renderNote();
      panel.innerHTML = `<div class="list"></div>`;
      const list = panel.querySelector('.list');
      for (const o of q.options) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<div><div class="lbl">${escapeHtml(o.label)}</div>${o.description ? `<div class="desc">${escapeHtml(o.description)}</div>` : ''}</div><span class="chev">${q.multiSelect ? '○' : '›'}</span>`;
        row.addEventListener('click', () => {
          if (q.multiSelect) {
            row.classList.toggle('sel');
            row.querySelector('.chev').textContent = row.classList.contains('sel') ? '✓' : '○';
            if (row.classList.contains('sel')) selected.add(o.label); else selected.delete(o.label);
            return;
          }
          row.classList.add('sel');
          answers[q.key || q.question] = o.label;
          setTimeout(next, 120);
        });
        list.appendChild(row);
      }
      // Free-text answer: Claude's question tool always accepts one. Typing needs keyboard
      // focus, so the overlay takes it only while this field is open and hands it back after.
      const otherRow = document.createElement('div');
      otherRow.className = 'row other';
      otherRow.innerHTML = `<div><div class="lbl">${escapeHtml(p.labels.other || 'Other…')}</div></div><span class="chev">✎</span>`;
      otherRow.addEventListener('click', () => {
        if (panel.querySelector('.free')) { panel.querySelector('.free input').focus(); return; }
        const box = document.createElement('div');
        box.className = 'free';
        box.innerHTML = `<input type="text" maxlength="500" placeholder="${escapeHtml(p.labels.typePlaceholder || '')}" autocomplete="off" spellcheck="false"><button class="btn primary">${escapeHtml(p.labels.send || 'Send')}</button>`;
        panel.appendChild(box);
        const input = box.querySelector('input');
        const submit = () => {
          const v = input.value.trim();
          if (!v) return;
          releaseInput(el);
          if (q.multiSelect) { selected.add(v); answers[q.key || q.question] = [...selected].join(', '); }
          else { answers[q.key || q.question] = v; }
          next();
        };
        box.querySelector('.btn').addEventListener('click', submit);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); submit(); }
          else if (e.key === 'Escape') { e.preventDefault(); releaseInput(el); box.remove(); layoutStack(); }
        });
        const extra = 180000;
        window.overlay.extendWait(p.id, extra);
        restartCountdown(extra);
        window.overlay.focusInput(true);
        // While the card has the keyboard, Tab reaches its × too.
        el.querySelector('.x').tabIndex = 0;
        setTimeout(() => input.focus(), 60);
        setTimeout(layoutStack, 80);
      });
      list.appendChild(otherRow);
      if (q.multiSelect) {
        const actions = document.createElement('div');
        actions.className = 'actions single';
        actions.innerHTML = `<button class="btn primary">${escapeHtml(p.labels.ok)}</button>`;
        actions.querySelector('.btn').addEventListener('click', () => {
          if (!selected.size) return;
          answers[q.key || q.question] = [...selected].join(', ');
          next();
        });
        panel.appendChild(actions);
      }
    };
    const next = () => {
      // Leaving this question (option, OK or Send) destroys its Other… field: hand the
      // keyboard back first, while the field still exists.
      releaseInput(el);
      idx += 1;
      if (idx < p.questions.length) {
        renderQ();
        // The next question's options now sit where the last click landed.
        disarm(el, REARM_MS);
        layoutStack();
      } else {
        answer(p, el, { answers });
      }
    };
    // The phone recorded answers: they replace the card's own for those questions, and a card
    // still on one of them moves on to the first question the phone has not answered. A card
    // that is further along keeps its place and its own later answers.
    el._progress = (got) => {
      if (el.classList.contains('answered')) return;
      for (const [k, v] of Object.entries(got || {})) {
        phone[k] = String(v);
        answers[k] = String(v);
      }
      const target = p.questions.findIndex((q) => !byPhone(q));
      if (target > idx) {
        // Its Other… field (if open) goes with the question: hand the keyboard back first.
        releaseInput(el);
        idx = target;
        renderQ();
      } else {
        renderNote();
      }
      // What was under the pointer has moved.
      disarm(el, REARM_MS);
      layoutStack();
    };
    renderQ();
    layoutStack();
  }

  // A card with HeadsUp's own buttons (continue a session when its usage limit resets). The
  // phone has the same buttons; whichever answers first wins and the host closes the other.
  // Unanswered, it leaves after `waitMs` (the question stays open on the phone).
  function showOffer(p) {
    if (closed.has(String(p.id))) { window.overlay.itemDone(); return; }
    const el = bannerShell(p, 'interactive');
    el.dataset.id = p.id;
    el._labels = p.labels || {};
    interactive.set(String(p.id), el);
    setTimeout(reportHotRects, 50);
    setTimeout(reportHotRects, 700);
    const c = el.querySelector('.content');
    if (p.body) c.innerHTML = `<div class="body">${escapeHtml(p.body)}</div>`;
    else c.remove();
    const list = Array.isArray(p.actions) ? p.actions : [];
    const panel = document.createElement('div');
    panel.className = 'panel';
    const actions = document.createElement('div');
    actions.className = list.length === 1 ? 'actions single' : 'actions';
    for (const a of list) {
      const b = document.createElement('button');
      b.className = a.primary ? 'btn primary' : 'btn';
      b.textContent = a.label || '';
      b.addEventListener('click', () => answer(p, el, { accept: !!a.accept }));
      actions.appendChild(b);
    }
    panel.appendChild(actions);
    const foot = document.createElement('div');
    foot.className = 'panel foot';
    foot.innerHTML = `<span class="hint"></span><span class="count"></span>`;
    const bar = document.createElement('div');
    bar.className = 'progress';
    el.append(panel, foot, bar);
    const wait = p.waitMs || 120000;
    const deadline = Date.now() + wait;
    el._runBar = () => {
      const left = Math.max(0, deadline - Date.now());
      bar.style.transition = 'none';
      bar.style.transform = `scaleX(${left / wait})`;
      void bar.offsetWidth;
      bar.style.transition = `transform ${left}ms linear`;
      bar.style.transform = 'scaleX(0)';
    };
    requestAnimationFrame(el._runBar);
    const count = foot.querySelector('.count');
    const tick = () => {
      if (!count.isConnected || el.classList.contains('answered')) return;
      const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      count.textContent = left >= 90 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : `${left}s`;
      if (left > 0) el._tick = setTimeout(tick, 250);
    };
    tick();
    if (p.sound) { try { chimeAsk(); } catch {} }
    el._timer = setTimeout(() => closeCard(el, false), wait);
    layoutStack();
  }

  function answer(p, el, data) {
    if (el.classList.contains('answered')) return;
    releaseInput(el);
    el.classList.add('answered');
    clearTimeout(el._tick);
    const hint = el.querySelector('.hint');
    if (hint) hint.textContent = `✓ ${p.labels.answered}`;
    window.overlay.answer(p.id, data);
    layoutStack();
  }

  // A question card's questions were answered on the phone, up to `index` (`answers`: every
  // answer recorded there so far, by question key).
  function cardProgress({ id, answers }) {
    const el = interactive.get(String(id));
    window.overlay.log(`progress ${id} found=${!!el}`);
    if (el && el._progress) el._progress(answers);
  }

  function resolveInteractive({ id, answered }) {
    const el = interactive.get(String(id));
    window.overlay.log(`resolve ${id} answered=${answered} found=${!!el}`);
    if (!el) return;
    interactive.delete(String(id));
    // Answered here, on the phone or in the terminal: an open Other… field must not keep
    // the keyboard (or the overlay focusable).
    releaseInput(el);
    if (!answered) {
      el.classList.add('expired');
      clearTimeout(el._tick);
      const hint = el.querySelector('.hint');
      if (hint) hint.textContent = (el._labels && el._labels.answerInApp) || '';
    }
    layoutStack();
    setTimeout(() => dismiss(el), answered ? 900 : 2500);
  }

  // -------------------------------------------------------------- logo
  const logoSlot = document.getElementById('logo-slot');
  const LOGO_GUARD_MS = 1500; // a logo that waits for a click ignores clicks this long
  const LOGO_SETTLE_MS = 15000; // it moves this long after it appears (or a new reset), then holds still
  // The logo on screen: { card, cap, hint, captions, sticky, anyClick, since, timer, armTimer,
  // settleTimer, motion, leaving }.
  let logo = null;

  function showLogo(p) {
    const caption = p.caption || 'Limit reset';
    if (logo && !logo.leaving) {
      // Another reset while it is up: it names that one too and starts over, never a second logo.
      window.overlay.itemDone();
      if (!logo.captions.includes(caption)) {
        logo.captions.push(caption);
        setCaption(logo);
      }
      logoMode(p);
      return;
    }
    if (logo) dropLogo(logo); // still on its way out
    const claude = p.icon === 'claude';
    const card = document.createElement('div');
    card.className = `logo-card${claude ? ' claude' : ''}`;
    card.innerHTML = `
      <div class="glow"></div>
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="logo-svg">${claude ? starburstSvg({ size: 118 }) : badgeSvg({ size: 118 })}</div>`;
    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.innerHTML = '<span class="cap-text"></span>';
    // Closing the logo is dismissing it.
    const x = closeButton(p, () => { if (logo === l) hideLogo(); });
    cap.appendChild(x);
    const l = { card, cap, x, hint: null, captions: [caption], sticky: false, anyClick: false, since: 0, timer: null, armTimer: null, settleTimer: null, motion: 0, leaving: false };
    logo = l;
    setCaption(l);
    logoSlot.appendChild(card);
    logoSlot.appendChild(cap);
    // Only the card's own exit ends it: its parts run animations of their own.
    card.addEventListener('animationend', (e) => {
      if (e.target === card && l.leaving) dropLogo(l);
    });
    if (p.sound) { try { chimeLogo(); } catch {} }
    logoMode(p);
  }

  function setCaption(l) {
    l.cap.querySelector('.cap-text').innerHTML = `<b>✦</b>&nbsp; ${l.captions.map(escapeHtml).join(' · ')}`;
  }

  // logo.dismiss. "auto": it leaves after durationMs. "anyClick": it stays until a click
  // anywhere on the screen, which the host sees (the overlay is click-through) and reports
  // with "logo-dismiss". "logoClick": until a click on the logo. In both, a click on the logo
  // itself dismisses it, and nothing does in the first LOGO_GUARD_MS (a click already under
  // way when it appeared); until then clicks go through to the window underneath.
  function logoMode(p) {
    const l = logo;
    const mode = p.dismiss === 'auto' || p.dismiss === 'logoClick' ? p.dismiss : 'anyClick';
    clearTimeout(l.timer);
    clearTimeout(l.armTimer);
    logoSlot.classList.remove('armed', 'closable');
    l.sticky = mode !== 'auto';
    l.anyClick = mode === 'anyClick';
    l.since = performance.now();
    window.overlay.logoState(l.sticky, l.anyClick);
    if (l.sticky && p.hint) {
      if (!l.hint) {
        l.hint = document.createElement('div');
        l.hint.className = 'logo-hint';
        logoSlot.appendChild(l.hint);
      }
      l.hint.textContent = p.hint;
    } else if (l.hint) {
      l.hint.remove();
      l.hint = null;
    }
    // After the guard time its × works, and a logo that waits for a click takes it all over.
    l.armTimer = setTimeout(() => {
      if (logo !== l || l.leaving) return;
      logoSlot.classList.add('closable');
      if (l.sticky) logoSlot.classList.add('armed');
      reportHotRects();
    }, LOGO_GUARD_MS);
    if (!l.sticky) l.timer = setTimeout(hideLogo, p.durationMs || 9000);
    // A new reset sets it moving again.
    l.motion++;
    clearTimeout(l.settleTimer);
    for (const el of l.card.querySelectorAll('.still')) el.classList.remove('still');
    l.settleTimer = setTimeout(() => settleLogo(l), LOGO_SETTLE_MS);
    reportHotRects();
  }

  // Each loop stops at the end of its current round, where it is at rest (no jump).
  function settleLogo(l) {
    if (logo !== l || l.leaving) return;
    const motion = l.motion;
    for (const el of l.card.querySelectorAll('.glow, .ring, .ray, .mk-up, .mk-low, .mk-dot')) {
      el.addEventListener('animationiteration', () => {
        if (l.motion === motion && !l.leaving) el.classList.add('still');
      }, { once: true });
    }
  }

  function hideLogo() {
    const l = logo;
    if (!l || l.leaving) return;
    l.leaving = true;
    clearTimeout(l.timer);
    clearTimeout(l.armTimer);
    clearTimeout(l.settleTimer);
    logoSlot.classList.remove('armed', 'closable');
    if (l.sticky) window.overlay.logoState(false, false);
    reportHotRects();
    l.card.classList.add('leaving');
    l.cap.classList.add('leaving');
    if (l.hint) l.hint.classList.add('leaving');
  }

  function dropLogo(l) {
    if (l.gone) return;
    l.gone = true;
    l.card.remove();
    l.cap.remove();
    if (l.hint) l.hint.remove();
    if (logo === l) logo = null;
    window.overlay.itemDone();
  }

  // A click anywhere on the screen, seen by the host. One it saw just as the logo appeared or
  // changed (a second reset) does not count: the logo stays, and the host watches again.
  function dismissLogo() {
    if (!logo || logo.leaving || !logo.anyClick) return;
    if (performance.now() - logo.since < LOGO_GUARD_MS) { window.overlay.logoState(true, true); return; }
    hideLogo();
  }

  // A click on the logo itself, with any mouse button (no context menu for the right one).
  logoSlot.addEventListener('pointerup', () => {
    if (logo && logo.sticky && logoSlot.classList.contains('armed')) hideLogo();
  });
  logoSlot.addEventListener('contextmenu', (e) => e.preventDefault());

  // logo.style: the Claude look (orange accent) or the HeadsUp look (teal).
  function applyStyle({ style }) {
    document.body.classList.toggle('style-claude', style !== 'headsup');
    document.body.classList.toggle('style-headsup', style === 'headsup');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // --------------------------------------------------------- tray icon
  function buildTrayIcon() {
    const c = document.getElementById('icon-canvas');
    const g = c.getContext('2d');
    const img = new Image();
    const svg = badgeSvg({ size: 32 });
    img.onload = () => {
      g.clearRect(0, 0, 32, 32);
      g.drawImage(img, 0, 0, 32, 32);
      window.overlay.sendTrayIcon(c.toDataURL('image/png'));
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  }

  window.onerror = (m, src, line, col) => { try { window.overlay.log(`error ${m} @${line}:${col}`); } catch {} };
  // The host holds events back until every listener is registered (see `ready`).
  Promise.all([
    window.overlay.on('style', applyStyle),
    window.overlay.on('notify', showBanner),
    window.overlay.on('interactive', showInteractive),
    window.overlay.on('offer', showOffer),
    window.overlay.on('resolve', resolveInteractive),
    window.overlay.on('card-progress', cardProgress),
    window.overlay.on('logo', showLogo),
    window.overlay.on('logo-dismiss', dismissLogo),
    window.overlay.on('hide-all', hideAll),
  ]).finally(() => { if (window.overlay.ready) window.overlay.ready(); });
  buildTrayIcon();
</script>
</body>
</html>
