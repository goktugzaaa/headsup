[package]
name = "headsup"
version = "3.3.0"
edition = "2021"
description = "Always-on-top notifications for the Claude desktop app and Claude Code on Windows"
license = "MIT"
repository = "https://github.com/goktugzaaa/headsup"

[[bin]]
name = "HeadsUp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
# Local endpoint auth: HMAC-SHA256 (built on sha2) with a per-install key from the OS CSPRNG.
sha2 = "0.10"
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
